version: '3.9'

# ============================================================
# Hospitable PMS Integration — Self-Host Docker Compose
# ============================================================
# Usage:
#   cp .env.example .env   # fill in your values
#   docker compose -f docker-compose.hospitable.yml up -d
#
# Access the app at: http://localhost:3000
# ============================================================

services:

  # ── Main Next.js application ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/aisaas
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # LLM provider keys (at least one required)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── PostgreSQL database ───────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aisaas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run the Hospitable schema on first start
      - ./lib/integrations/hospitable/schema.sql:/docker-entrypoint-initdb.d/20-hospitable.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — not exposed externally
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aisaas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cron runner (calls hospitable-sync every 15 minutes) ─
  # Lightweight Alpine container — no Node.js required
  cron:
    image: alpine:3.19
    entrypoint: /bin/sh
    command: >
      -c "
        echo 'Hospitable cron runner starting...';
        while true; do
          echo \"[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Running Hospitable sync...\";
          wget -qO- \
            --header=\"Authorization: Bearer $CRON_SECRET\" \
            --server-response \
            http://app:3000/api/cron/hospitable-sync \
            2>&1 | tail -5;
          echo \"[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Sleeping 15 minutes...\";
          sleep 900;
        done
      "
    environment:
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

# ============================================================
# Required environment variables (.env file):
#
#   CRON_SECRET=<secure-random-string>
#   ENCRYPTION_SECRET=<secure-random-string>
#   POSTGRES_PASSWORD=<your-db-password>
#   NEXT_PUBLIC_APP_URL=https://yourdomain.com
#
# Optional (provide at least one LLM key):
#   OPENAI_API_KEY=sk-...
#   ANTHROPIC_API_KEY=sk-ant-...
#   GOOGLE_GENERATIVE_AI_API_KEY=AIza...
#
# Optional (Redis for dedup/caching — recommended for production):
#   UPSTASH_REDIS_REST_URL=https://...
#   UPSTASH_REDIS_REST_TOKEN=...
# ============================================================
