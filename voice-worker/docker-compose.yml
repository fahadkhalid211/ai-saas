# Voice worker + automatic HTTPS. Only ports 80 and 443 are exposed; the worker itself is internal.
services:
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VOICE_DOMAIN=${VOICE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - worker

volumes:
  models:
  caddy_data:
  caddy_config:
